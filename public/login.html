<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · Ollama Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f0a72c' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18'/%3E%3Cpath d='M7 9l3 3-3 3M13 15h4'/%3E%3C/svg%3E" />
<link rel="preload" href="fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-page">
    <form id="authForm" class="auth-card" novalidate>
      <div class="auth-main">
        <span class="auth-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        </span>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">This console runs models on your own hardware. Sign in to open your sessions.</p>

        <div id="authError" class="error-banner hidden" role="alert">
          <span class="error-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
          </span>
          <span id="authErrorText"></span>
        </div>

        <label class="field">
          <span>Username</span>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>

        <button type="submit" id="submitBtn" class="btn btn-primary full">Log in</button>

        <ul class="auth-meta">
          <li>Local SQLite</li>
          <li>scrypt hashed</li>
          <li>No network</li>
        </ul>

        <p class="auth-switch">No account yet? <a href="/signup.html">Create one</a></p>
      </div>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    initAuthPage({ mode: 'login', formId: 'authForm', submitBtnId: 'submitBtn', errorId: 'authError', errorTextId: 'authErrorText' });
  </script>
</body>
</html>
