  - main [ref=f14e17]:
    - region [ref=f14e18]:
      - generic [ref=f14e20]:
        - paragraph [ref=f14e21]: the world
        - heading "One city, the same every time you load it." [level=1] [ref=f14e23]
        - paragraph [ref=f14e24]: The map is 96×96 tiles, generated by a deterministic hash function rather than stored anywhere — every block, every park and every hidden shop lands in the same place on every visit, computed fresh from nothing but its coordinates.
    - region "World systems" [ref=f14e52]:
      - generic [ref=f14e54]:
        - generic [ref=f14e57]:
          - heading "A hashed grid, not a stored map" [level=3] [ref=f14e58]
          - paragraph [ref=f14e59]: There's no map file. tileType(tx, ty) hashes each tile's coordinates to decide road, sidewalk, building, park or water — reproducible, seedless, and free of any asset to load.
        - generic [ref=f14e62]:
          - heading "10×10 city blocks" [level=3] [ref=f14e63]
          - paragraph [ref=f14e64]: Every block is bordered by through-roads with sidewalk edges, so the traffic grid, the pedestrian network and the minimap all agree on where a car can go — for free, from the same function.
        - generic [ref=f14e67]:
          - heading "Buildings with presence" [level=3] [ref=f14e68]
          - paragraph [ref=f14e69]: Merged building blocks get roofs, AC units, neon signs and drop shadows instead of flat rectangles — camera-parallax makes the rooftops shift as you drive past.
        - generic [ref=f14e72]:
          - heading "Parks — and hideouts" [level=3] [ref=f14e73]
          - paragraph [ref=f14e74]: Roughly one block in six is a park. Standing in one, out of a cop's sightline, quadruples how fast your wanted level cools down.
        - generic [ref=f14e77]:
          - heading "Sidewalks & crosswalks" [level=3] [ref=f14e78]
          - paragraph [ref=f14e79]: Curbed sidewalks ring every block with zebra crosswalks at the corners — where the pedestrian population actually spends its time.
        - generic [ref=f14e82]:
          - heading "A river with real bridges" [level=3] [ref=f14e83]
          - paragraph [ref=f14e84]: A fixed four-tile-wide river cuts through the world. Only tiles that would otherwise be sidewalk, park or building turn to water — the through-roads are left alone, so the river gets a natural bridge on every block row without any special-cased bridge logic.
        - generic [ref=f14e87]:
          - heading "A stadium landmark" [level=3] [ref=f14e88]
          - paragraph [ref=f14e89]: One fixed 2×2-block footprint renders as a bespoke stadium bowl instead of a generic building — a mental-map anchor in an otherwise-repeating grid, and one of only two hand-placed landmarks in the whole city.
        - generic [ref=f14e92]:
          - heading "A slow day/night cycle" [level=3] [ref=f14e93]
          - paragraph [ref=f14e94]: A 240-second phase eases the city between its tuned night look and a paler dawn/dusk wash — never full daylight, so the neon-and-headlight art direction holds for most of a session.
        - generic [ref=f14e97]:
          - heading "A live minimap" [level=3] [ref=f14e98]
          - paragraph [ref=f14e99]: The HUD's corner minimap tracks your position against the block grid in real time, drawn from the same tile data as everything else on screen.
    - region [ref=f14e100]:
      - generic [ref=f14e101]:
        - generic [ref=f14e102]:
          - generic [aria-hidden]: "02"
          - paragraph [ref=f14e103]: hidden in the grid
          - heading "Four corner shops, tucked into the intersections." [level=2] [ref=f14e105]
          - paragraph [ref=f14e106]: Every block corner has a small chance of hosting a service — each rejects the corners already claimed by the others, so no two ever land on the same tile. Score is the only currency in this city, and all four spend it.
        - generic [ref=f14e107]:
          - article [ref=f14e108]:
            - heading "The garage" [level=3] [ref=f14e109]
            - paragraph [ref=f14e110]: Park your current car here for two seconds and its rolled handling, paint and health are saved to localStorage — it'll be waiting at your next spawn instead of being abandoned like every other stolen car.
          - article [ref=f14e111]:
            - heading "The paint shop" [level=3] [ref=f14e112]
            - paragraph [ref=f14e113]: "A respray costs nothing but time: two seconds parked drops your wanted level by two stars and rolls a new color, because a fresh coat and new plates buy some anonymity."
          - article [ref=f14e114]:
            - heading "The gas station" [level=3] [ref=f14e115]
            - paragraph [ref=f14e116]: Full repair for both you and your car — −150 score, only while damaged, only while you can afford it.
          - article [ref=f14e117]:
            - heading "The corner mart" [level=3] [ref=f14e118]
            - paragraph [ref=f14e119]: On foot, pay the clerk −300 score to forget your face — one star of heat gone, and your cooldown timer resumes immediately instead of waiting out the usual grace period.
    - region [ref=f14e120]:
      - generic [ref=f14e121]:
        - generic [ref=f14e122]:
          - heading "Five tile types. Everything else is drawn on top." [level=2] [ref=f14e123]: Five tile types.Everything else is drawn on top.
          - paragraph [ref=f14e124]: Collision, traffic, pedestrian pathing, the minimap and mission placement all read the exact same five values — nothing has its own separate notion of what's walkable or drivable.
        - list "Tile types" [ref=f14e125]:
          - listitem [ref=f14e126]: Road — where cars and traffic drive
          - listitem [ref=f14e128]: Sidewalk — where pedestrians walk and crosswalks sit
          - listitem [ref=f14e130]: Building — solid; also where the stadium renders
          - listitem [ref=f14e132]: Park — a hideout that speeds up heat decay
          - listitem [ref=f14e134]: Water — the river; the only tile no vehicle can enter
