          - heading "One punch. Maybe a bat. Never a gun." [level=1] [ref=f27e21]
          - paragraph [ref=f27e22]: "Combat in Local Theft Auto is shove-and-stun comedy, not a shooter: pedestrians panic and stagger back, police get briefly stunned rather than hurt, and the only upgrade you'll ever find lying in the street is a baseball bat."
        - generic [ref=f27e24]:
