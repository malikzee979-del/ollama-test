    - region "Combat systems" [ref=f27e27]:
      - generic [ref=f27e28]:
        - generic [ref=f27e29]:
          - article [ref=f27e30]:
            - heading "The punch" [level=3] [ref=f27e31]
            - paragraph [ref=f27e32]: On foot, press F to swing in front of you. Anyone standing inside the reach and arc gets knocked back and startled — a short cooldown keeps it from becoming a machine gun.
          - article [ref=f27e33]:
            - heading "The bat" [level=3] [ref=f27e34]
            - paragraph [ref=f27e35]: Pick one up from a weapon drop and every future swing reaches further and stuns a police officer more than twice as long — 2.5 seconds instead of 1.2.
        - generic [ref=f27e36]:
          - generic [ref=f27e39]:
            - heading "Pedestrians who panic" [level=3] [ref=f27e40]
            - paragraph [ref=f27e41]: A hit ped doesn't just flinch — it flees for a few seconds at a raised panic speed, the same fear response a near-miss from a fast car or a nearby siren triggers.
          - generic [ref=f27e44]:
            - heading "Cops that stun, not fall" [level=3] [ref=f27e45]
            - paragraph [ref=f27e46]: Landing a hit on an officer freezes their pursuit briefly (their siren keeps flashing) — but it also adds a full star of wanted level, because assaulting an officer is exactly as serious as it sounds, locally.
          - generic [ref=f27e49]:
            - heading "Rubbernecking" [level=3] [ref=f27e50]
            - paragraph [ref=f27e51]: Nearby pedestrians who aren't already panicking will stop and stare at a recent crash or wreck instead of walking on — a small touch that makes the city feel like it's actually watching.
          - generic [ref=f27e54]:
            - heading "Comedy, not gore" [level=3] [ref=f27e55]
            - paragraph [ref=f27e56]: Nobody dies on screen. Peds "go down" and respawn elsewhere shortly after; the aesthetic stays a toy city the whole way through — deliberately, not as a technical limitation.
    - region [ref=f27e57]:
      - generic [ref=f27e58]:
        - generic [ref=f27e59]:
          - heading "Land enough hits, earn the achievement." [level=2] [ref=f27e60]
          - paragraph [ref=f27e61]: Every connecting punch or swing counts toward your lifetime stats, tracked right alongside steals and deliveries — throw enough of them and Brawler unlocks for good.
